# Credenciais locais, só para desenvolvimento; não há .env.
x-database-url: &database-url postgres://casecellshop:casecellshop@postgres:5432/casecellshop

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: casecellshop
      POSTGRES_PASSWORD: casecellshop
      POSTGRES_DB: casecellshop
    volumes:
      # No PostgreSQL 18 a imagem espera o volume em /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Com --host o teste vai por TCP: na primeira subida a imagem roda um servidor temporário
      # só no socket Unix, e sem host o banco ficaria saudável antes de a porta abrir.
      # Usa 127.0.0.1 (IPv4 explícito), como recomenda a imagem oficial, pois localhost pode resolver para IPv6.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 -U casecellshop -d casecellshop"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Execução única: migra os dois schemas e grava o catálogo de exemplo do ERP simulado.
  migrate:
    build: .
    command: ["node", "src/main/migrate.ts"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["node", "src/main/api.ts"]
    environment:
      DATABASE_URL: *database-url
      PORT: "3000"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: casecellshop-api
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      # Cada chamada gera um trace de /health: na subida checa a cada 2 s, depois a cada 30 s.
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # O processo encerra em 25 s; o Docker manda SIGKILL 10 s depois do SIGTERM se o prazo não for maior.
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/main/worker.ts"]
    environment:
      DATABASE_URL: *database-url
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: casecellshop-worker
      # Credenciais fixas e sem segredo: o SDK exige alguma, o ElasticMQ as ignora.
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: elasticmq
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      BILLING_QUEUE_URL: http://elasticmq:9324/000000000000/billing
      BILLING_DLQ_URL: http://elasticmq:9324/000000000000/billing-dlq
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    stop_grace_period: 30s
    restart: unless-stopped

  # Emulador do SQS (AD-021). As filas vêm do elasticmq.conf; mensagens e filas ficam no volume,
  # para sobreviver ao reinício. A porta 9324 fica só na rede do compose.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
      - elasticmq-data:/data
    restart: unless-stopped

  # All-in-one em memória, sem arquivo de configuração: os traces somem ao derrubar o serviço.
  # O OTLP/HTTP (4318) não tem autenticação e fica só na rede do compose: a API e o worker
  # chegam nele por http://jaeger:4318, então a porta não é publicada no host.
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

volumes:
  pgdata:
  elasticmq-data:
