include classpath("application.conf")

# Mensagens e filas persistem no volume /data (a retenção não é implementada pelo ElasticMQ).
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}

queues-storage {
  enabled = true
  path = "/data/queues.conf"
}

queues {
  billing-dlq { }
  billing {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue { name = "billing-dlq", maxReceiveCount = 12 }
  }
}
