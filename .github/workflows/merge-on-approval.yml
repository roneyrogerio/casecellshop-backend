name: Merge na aprovação

# AI-10: a aprovação do dono é a decisão; o merge é mecânico. Este workflow só
# confere que a revisão enviada é a aprovação do dono num PR deste repositório, e
# o término dele dispara o merge-by-app.yml, que liga o auto-merge pelo GitHub App.
#
# Num pull_request_review, o GitHub roda a versão deste arquivo que está no PR. Por
# isso ele não tem secret nem permissão: um PR que o alterasse não alcançaria nada.
# A chave do App fica no ambiente merge, que só a main acessa, e o merge-by-app.yml
# roda sempre a versão da main. Nenhum agente faz merge.
on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  approval:
    name: Confere a aprovação do dono
    permissions: {}
    # Só a aprovação do dono, e só para PR de branch deste repositório (nunca de fork).
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Sem checkout: o workflow não executa nada do código do PR.
      - name: Registra a aprovação
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Bloco literal: num escalar simples do YAML, o " #" começaria um comentário.
        run: |
          echo "Aprovação do dono no PR #$PR_NUMBER; o merge-by-app.yml liga o auto-merge."
