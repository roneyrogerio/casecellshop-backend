name: CI

on:
  pull_request:
  push:
    branches: [main]

# AI-05: o token do CI só lê. O repositório é público, e um job que roda código
# do PR não pode ter permissão de escrita nem credencial guardada no checkout.
permissions:
  contents: read

# AI-17: um push novo no PR torna a execução anterior inútil, então ela é
# cancelada; na main nunca, para cada merge ter o seu resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# AI-53: arquivos de texto que nenhum teste lê. O PR que só muda arquivos daqui não
# roda o test nem o api-fuzz, e esses dois jobs rodam sempre sem eles, para o
# resultado nunca depender deles. Arquivos exatos, e não globs: um arquivo novo em
# .specs/ (como um que um teste regenera e compara) roda tudo.
env:
  DOCS_ONLY_PATHS: |
    README.md
    .specs/README.md
    .specs/codebase/CONVENTIONS.md
    .specs/features/casecellshop/design.md
    .specs/project/PROJECT.md
    .specs/project/ROADMAP.md
    .specs/project/STATE.md
    .specs/project/STATE-ARCHIVE.md

jobs:
  # AI-53: decide se o PR só muda arquivos da DOCS_ONLY_PATHS. Não é paths-ignore:
  # com o workflow pulado, o ci-ok que o ruleset exige ficaria pendente.
  changes:
    name: Mudanças do PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      # O checkout do pull_request é o commit de merge do PR com a base: o primeiro
      # pai é a base, e o diff entre os dois é o que os testes veriam de novo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Sem --no-renames, um rename de src/ para o README.md mostraria só o nome
      # novo. O -z mantém inteiro um nome com quebra de linha. Um erro do git
      # reprova o passo, e o ci-ok com ele. Só um PR contra a main pula: contra outra
      # branch que já tem o código, o PR sairia só de documentação e, com a base
      # trocada para a main depois (pull_request edited, que não roda o CI), levaria
      # o ci-ok verde sem testes.
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          docs_only=false
          # O commit e os pais numa linha; o merge do PR tem dois pais.
          head_line=$(git rev-list --parents -n 1 HEAD)
          read -ra commits <<< "$head_line"
          if [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" = main ] && [ "${#commits[@]}" -eq 3 ]; then
            mapfile -t allowed <<< "$DOCS_ONLY_PATHS"
            list=$(mktemp)
            git diff --name-only --no-renames -z HEAD^1 HEAD > "$list"
            mapfile -d '' -t changed < "$list"
            if [ "${#changed[@]}" -gt 0 ]; then
              docs_only=true
              for file in "${changed[@]}"; do
                listed=false
                for path in "${allowed[@]}"; do
                  if [ -n "$path" ] && [ "$file" = "$path" ]; then listed=true; fi
                done
                if [ "$listed" = false ]; then
                  # %q escapa a quebra de linha: o nome não vira comando do runner.
                  printf 'Fora da lista: %q\n' "$file"
                  docs_only=false
                fi
              done
            fi
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # AI-42: o que não depende da versão do Node roda uma vez, aqui, em paralelo
  # com os testes; um lint vermelho já não impede os testes de darem o resultado.
  checks:
    name: Checagens
    runs-on: ubuntu-latest
    # AI-05: um passo travado não segura o runner pelas 6 horas do padrão; cada
    # prazo fica algumas vezes acima do tempo que o job leva hoje.
    timeout-minutes: 15
    env:
      REDOCLY_TELEMETRY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As conferências das migrações e dos commits comparam com a base do PR.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # AI-05: todo pacote do lockfile vem do registro oficial, com sha512. Pelo
      # node, e não por npm run: o package.json é do próprio PR.
      - run: node scripts/check-lockfile.ts
      # AI-42: a assinatura do registro e a atestação de cada pacote que o npm ci
      # baixou; pega um pacote adulterado, que o npm audit não vê.
      - run: npm audit signatures
      - run: npm run lint
      # AI-34: o código no formato do Prettier. Roda pelo binário, e não por npm run (AI-05).
      - run: node_modules/.bin/prettier --check .
      - run: npm run typecheck
      # AI-35, AI-36 e AI-39: código sem uso, código repetido novo (contra a linha de
      # base) e vulnerabilidade numa dependência de produção. Pelo binário, e não
      # por npm run (AI-05).
      - run: node_modules/.bin/knip --no-progress
      - run: node_modules/.bin/jscpd --config .jscpd.json --baseline .jscpd-baseline.json --fail-on-new-clones
      - run: npm audit --omit=dev

      # FND-07: openapi.yaml em dia com o contrato e válido em OpenAPI 3.1.
      - run: npm run openapi -- --check
      - run: npm run lint:openapi

      # FND-06: o que carrega em toda sessão do Claude Code fica nos limites dele.
      - run: npm run check:instructions

      # As duas conferências abaixo rodam com node, e não por npm run: o package.json
      # é do próprio PR, que poderia redefinir o script que o confere (AI-05).
      # AI-01: arquivo de migrations/ já na base não pode ser alterado nem apagado
      # (fora o .gitkeep e a remoção de um .sql, que deixou de ser migração). A base
      # entra pelo ambiente, e não interpolada no script, para o nome da branch
      # nunca virar código no shell.
      - name: Migrações da base ficam intactas
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migrations.ts

      # AI-05: o package.json fora dos blocos de dependências define o que este CI e
      # o hook de parada rodam; só um commit ci: ou build: da sessão principal o muda.
      - name: package.json fora das dependências intacto
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-scripts.ts

      # AI-49: o piso de cobertura só sobe e a linha de base do jscpd só perde
      # repetições, contra a base do PR.
      - name: Piso de cobertura e linha de base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-baselines.ts

      # CONVENTIONS.md, "Commits": o cabeçalho de cada commit do PR, como no guia de
      # CI do commitlint. Os commits do Dependabot ficam de fora (AI-45).
      # Os SHAs entram pelo ambiente, e não interpolados no script, como a BASE_REF.
      - name: Valida os commits do PR com o commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  test:
    name: Node ${{ matrix.node }}
    # AI-53: pulado só no PR que muda apenas arquivos da DOCS_ONLY_PATHS.
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # "nvmrc" lê a versão do .nvmrc; a 24.12.0 é o piso do engines.
        node: [nvmrc, '24.12.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Testes de test/repo/ leem o histórico do git.
          fetch-depth: 0
          persist-credentials: false

      # AI-53: uma pasta vazia no lugar de cada arquivo da lista. Um teste que leia um
      # deles, pelo caminho ou depois de listar a pasta, reprova com EISDIR; apagado,
      # o arquivo sumiria da listagem e o teste passaria sem conferi-lo. Assim pular o
      # job no PR que só muda esses arquivos não perde nada.
      - name: Troca os arquivos que o AI-53 não testa por pastas
        run: |
          mapfile -t paths <<< "$DOCS_ONLY_PATHS"
          for path in "${paths[@]}"; do
            # Uma pasta de verdade fica; um link para pasta sai, porque o teste
            # leria pelo link o que ele aponta.
            if [ -z "$path" ]; then continue; fi
            if [ ! -d "$path" ] || [ -L "$path" ]; then rm -f -- "$path"; fi
            mkdir -p -- "$path"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Se os dois inputs vierem preenchidos, o setup-node usa só o node-version
          # e avisa; por isso um deles fica sempre vazio.
          node-version: ${{ matrix.node != 'nvmrc' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'nvmrc' && '.nvmrc' || '' }}
          cache: npm

      - run: npm ci
      # Os testes de integração usam o Docker do runner (Testcontainers e compose).
      # AI-42: a lista própria de reporters substitui os padrões do Vitest, então o
      # github-actions (a anotação da falha no diff) entra por nome; o JSON alimenta
      # a tabela critério × teste do resumo (AI-18). Nenhum retry: uma falha que some
      # na repetição é o sinal de uma corrida.
      # FND-12: na perna do piso, os testes que sobem o compose ficam de fora, porque a
      # imagem fixa o Node do Dockerfile e repetiria o que a perna do .nvmrc já testou.
      # AI-37: a cobertura de src/ e o piso dela, uma vez só, na perna do .nvmrc.
      # AI-49: o json-summary vai para fora da árvore do repositório, onde um
      # relatório versionado não toma o lugar do medido.
      - run: npm test -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json" ${{ matrix.node == '24.12.0' && '--exclude test/integration/foundation/compose.test.ts --exclude test/integration/billing/worker-compose.test.ts' || '' }} ${{ matrix.node == 'nvmrc' && '--coverage --coverage.reporter=text --coverage.reporter=json-summary --coverage.reportsDirectory="$RUNNER_TEMP/coverage"' || '' }}

      # AI-49: a cobertura medida contra o piso da base, e não contra o piso que o
      # vitest.config.ts, a linha de comando ou o ambiente do PR passaram ao Vitest.
      - name: Cobertura medida contra o piso da base
        if: matrix.node == 'nvmrc' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-baselines.ts --measured "$RUNNER_TEMP/coverage/coverage-summary.json"

      # AI-18: a tabela que o dono lê antes de aprovar; informa e não reprova. Roda
      # também com teste vermelho, que é quando ela mais ajuda, e uma vez só.
      - name: Tabela critério × teste
        if: ${{ !cancelled() && matrix.node == 'nvmrc' }}
        run: node scripts/criteria-report.ts "$RUNNER_TEMP/vitest-report.json" >> "$GITHUB_STEP_SUMMARY"

      # FND-09: os tipos do banco versionados batem com o banco migrado. Sobe o
      # próprio PostgreSQL pelo Testcontainers, por isso fica no job que já usa o
      # Docker; uma vez só. Roda com node, e não por npm run (AI-05).
      - name: Tipos do banco em dia
        if: matrix.node == 'nvmrc'
        run: node scripts/check-db-types.ts

  # AI-43: os workflows conferidos sem Node. O actionlint pega o YAML que não roda
  # (expressão, contexto, shellcheck do run:); o zizmor, o que roda e é inseguro
  # (action sem SHA, commit de fork, permissão demais, injeção no shell).
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versão fixa, e o tarball só é extraído depois de bater com o sha256 fixo
      # aqui: uma release trocada traria um arquivo de checksums trocado junto. O
      # script oficial de instalação vem da branch e não confere nada.
      - name: actionlint
        run: |
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint

      # advanced-security: false faz o achado reprovar o job pelo código de saída,
      # sem pedir escrita no code scanning; o token de leitura liga as auditorias que
      # consultam a API (commit de fork no lugar do da action, action vulnerável).
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          token: ${{ github.token }}

  # FND-16: a versão leve do fuzzing, em paralelo aos outros jobs, com a semente e o
  # número de exemplos fixos do compose.yaml, para o resultado do PR ser repetível; o
  # agendado roda o mesmo serviço com a semente da execução.
  api-fuzz:
    name: Fuzzing da API
    # AI-53: como o test, pulado só no PR que muda apenas arquivos da lista.
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AI-53: como no job test.
      - name: Troca os arquivos que o AI-53 não testa por pastas
        run: |
          mapfile -t paths <<< "$DOCS_ONLY_PATHS"
          for path in "${paths[@]}"; do
            # Uma pasta de verdade fica; um link para pasta sai, porque o teste
            # leria pelo link o que ele aponta.
            if [ -z "$path" ]; then continue; fi
            if [ ! -d "$path" ] || [ -L "$path" ]; then rm -f -- "$path"; fi
            mkdir -p -- "$path"
          done
      - name: Cria o diretório do relatório
        # A imagem roda como uid 1000; montado sem existir, o diretório nasceria
        # com dono root e modo 755, e o Schemathesis sairia sem gravar (A25).
        run: install -d -m 0777 schemathesis-report
      - name: Fuzzing com o Schemathesis
        run: docker compose --profile fuzz run --rm schemathesis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: schemathesis-report
          path: schemathesis-report
          retention-days: 7
      - name: Derruba o compose
        if: always()
        run: docker compose --profile fuzz down -v

  # AI-42: o único check que o ruleset exige. Um job pulado conta como verde, e um
  # job que depende de outro que falhou é pulado; por isso este roda sempre e olha
  # o resultado de cada um. Mudar os jobs acima não mexe no ruleset.
  # AI-53: pelo mesmo motivo, o ci-ok aceita só o que passa, e não reprova só o que
  # falha: um resultado ausente ou que o GitHub venha a criar reprova também.
  ci-ok:
    name: ci-ok
    needs: [changes, checks, test, workflows, api-fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          # Sem entrada, o jq não produz nada e sai com 0; o -e exige um objeto com
          # algum job e reprova o vazio e o que não é JSON.
          jq -e 'type == "object" and length > 0' <<< "$RESULTS" > /dev/null
          # Passa o success, e o test e o api-fuzz pulados quando o changes decidiu
          # que o PR é só de documentação; todo o resto vai para a lista.
          rejected=$(jq -r --arg docs_only "$DOCS_ONLY" '
            to_entries[]
            | select(
                .value.result != "success"
                and (
                  .value.result != "skipped"
                  or $docs_only != "true"
                  or (.key != "test" and .key != "api-fuzz")
                )
              )
            | "\(.key): \(.value.result)"' <<< "$RESULTS")
          if [ -n "$rejected" ]; then
            printf 'Job que não passa:\n%s\n' "$rejected"
            exit 1
          fi
