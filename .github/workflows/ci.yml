name: CI

on:
  pull_request:
  push:
    branches: [main]

# AI-05: o token do CI só lê. O repositório é público, e um job que roda código
# do PR não pode ter permissão de escrita nem credencial guardada no checkout.
permissions:
  contents: read

# AI-17: um push novo no PR torna a execução anterior inútil, então ela é
# cancelada; na main nunca, para cada merge ter o seu resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # AI-42: o que não depende da versão do Node roda uma vez, aqui, em paralelo
  # com os testes; um lint vermelho já não impede os testes de darem o resultado.
  checks:
    name: Checagens
    runs-on: ubuntu-latest
    env:
      REDOCLY_TELEMETRY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As conferências das migrações e dos commits comparam com a base do PR.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # AI-42: a assinatura do registro e a atestação de cada pacote que o npm ci
      # baixou; pega um pacote adulterado, que o npm audit não vê.
      - run: npm audit signatures
      - run: npm run lint
      # AI-34: o código no formato do Prettier. Roda pelo binário, e não por npm run (AI-05).
      - run: node_modules/.bin/prettier --check .
      - run: npm run typecheck
      # AI-35, AI-36 e AI-39: código sem uso, código repetido novo (contra a linha de
      # base) e vulnerabilidade numa dependência de produção. Pelo binário, e não
      # por npm run (AI-05).
      - run: node_modules/.bin/knip --no-progress
      - run: node_modules/.bin/jscpd --config .jscpd.json --baseline .jscpd-baseline.json --fail-on-new-clones
      - run: npm audit --omit=dev

      # FND-07: openapi.yaml em dia com o contrato e válido em OpenAPI 3.1.
      - run: npm run openapi -- --check
      - run: npm run lint:openapi

      # FND-06: o que carrega em toda sessão do Claude Code fica nos limites dele.
      - run: npm run check:instructions

      # As duas conferências abaixo rodam com node, e não por npm run: o package.json
      # é do próprio PR, que poderia redefinir o script que o confere (AI-05).
      # AI-01: arquivo de migrations/ já na base não pode ser alterado nem apagado
      # (fora o .gitkeep e a remoção de um .sql, que deixou de ser migração). A base
      # entra pelo ambiente, e não interpolada no script, para o nome da branch
      # nunca virar código no shell.
      - name: Migrações da base ficam intactas
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migrations.ts

      # AI-05: o package.json fora dos blocos de dependências define o que este CI e
      # o hook de parada rodam; só um commit ci: ou build: da sessão principal o muda.
      - name: package.json fora das dependências intacto
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-scripts.ts

      # CONVENTIONS.md, "Commits": o cabeçalho de cada commit do PR, como no guia de
      # CI do commitlint. Os commits do Dependabot ficam de fora (AI-45).
      # Os SHAs entram pelo ambiente, e não interpolados no script, como a BASE_REF.
      - name: Valida os commits do PR com o commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "nvmrc" lê a versão do .nvmrc; a 24.12.0 é o piso do engines.
        node: [nvmrc, '24.12.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Testes de test/repo/ leem o histórico do git.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Se os dois inputs vierem preenchidos, o setup-node usa só o node-version
          # e avisa; por isso um deles fica sempre vazio.
          node-version: ${{ matrix.node != 'nvmrc' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == 'nvmrc' && '.nvmrc' || '' }}
          cache: npm

      - run: npm ci
      # Os testes de integração usam o Docker do runner (Testcontainers e compose).
      # AI-42: a lista própria de reporters substitui os padrões do Vitest, então o
      # github-actions (a anotação da falha no diff) entra por nome; o JSON alimenta
      # a tabela critério × teste do resumo (AI-18). Nenhum retry: uma falha que some
      # na repetição é o sinal de uma corrida.
      # FND-12: na perna do piso, os testes que sobem o compose ficam de fora, porque a
      # imagem fixa o Node do Dockerfile e repetiria o que a perna do .nvmrc já testou.
      # AI-37: a cobertura de src/ e o piso dela, uma vez só, na perna do .nvmrc.
      - run: npm test -- --reporter=default --reporter=github-actions --reporter=json --outputFile.json=$RUNNER_TEMP/vitest-report.json ${{ matrix.node == '24.12.0' && '--exclude test/integration/foundation/compose.test.ts --exclude test/integration/billing/worker-compose.test.ts' || '' }} ${{ matrix.node == 'nvmrc' && '--coverage' || '' }}

      # AI-18: a tabela que o dono lê antes de aprovar; informa e não reprova. Roda
      # também com teste vermelho, que é quando ela mais ajuda, e uma vez só.
      - name: Tabela critério × teste
        if: ${{ !cancelled() && matrix.node == 'nvmrc' }}
        run: node scripts/criteria-report.ts $RUNNER_TEMP/vitest-report.json >> "$GITHUB_STEP_SUMMARY"

      # FND-09: os tipos do banco versionados batem com o banco migrado. Sobe o
      # próprio PostgreSQL pelo Testcontainers, por isso fica no job que já usa o
      # Docker; uma vez só. Roda com node, e não por npm run (AI-05).
      - name: Tipos do banco em dia
        if: matrix.node == 'nvmrc'
        run: node scripts/check-db-types.ts

  # AI-42: o único check que o ruleset exige. Um job pulado conta como verde, e um
  # job que depende de outro que falhou é pulado; por isso este roda sempre e olha
  # o resultado de cada um. Mudar os jobs acima não mexe no ruleset.
  ci-ok:
    name: ci-ok
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "Um job falhou ou foi cancelado."
            exit 1
          fi
