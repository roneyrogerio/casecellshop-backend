name: Agendado

# AI-46: o que muda sem commit e o que o CI do PR não cobre. Uma vulnerabilidade
# nova, um alerta novo numa action fixada e o comportamento de uma dependência
# chegam sem commit; e um teste que depende da ordem só aparece com a ordem
# embaralhada. Fora da hora cheia, quando o GitHub atrasa os
# agendamentos; workflow_dispatch para rodar à mão.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Uma execução não cancela a outra: cada dia tem o seu resultado.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Na main, as checagens do job checks, a suíte com cobertura e os tipos do banco;
  # ficam de fora o que só existe num PR (migrações, package.json e commits contra a
  # base), o job workflows e a perna do piso.
  main-full:
    name: CI completo na main
    runs-on: ubuntu-latest
    # AI-05: o tempo esgotado termina o job como cancelado, e o report avisa.
    timeout-minutes: 30
    env:
      REDOCLY_TELEMETRY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: node scripts/check-lockfile.ts
      - run: npm audit signatures
      - run: npm run lint
      - run: node_modules/.bin/prettier --check .
      - run: npm run typecheck
      - run: node_modules/.bin/knip --no-progress
      - run: node_modules/.bin/jscpd --config .jscpd.json --baseline .jscpd-baseline.json --fail-on-new-clones
      - run: npm audit --omit=dev
      - run: npm run openapi -- --check
      - run: npm run lint:openapi
      - run: npm run check:instructions
      - run: npm test -- --reporter=default --reporter=github-actions --coverage
      - run: node scripts/check-db-types.ts

  # A ordem dos arquivos e dos testes muda a cada perna; a semente vai para o log,
  # e quem acha uma falha a reproduz com --sequence.seed.
  flaky-hunt:
    name: Testes embaralhados (${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Testes de test/repo/ leem o histórico do git.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Suíte com a ordem embaralhada
        env:
          SEED: ${{ github.run_id }}${{ matrix.seed }}
          # FND-15: as propriedades do fast-check rodam com a semente da execução e mais casos.
          FAST_CHECK_SEED: ${{ github.run_id }}${{ matrix.seed }}
          FAST_CHECK_NUM_RUNS: '1000'
        run: |
          echo "Semente: $SEED"
          npm test -- --sequence.shuffle.files --sequence.shuffle.tests --sequence.seed="$SEED" --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-embaralhado-${{ matrix.seed }}
          path: ${{ runner.temp }}/vitest-report.json
          retention-days: 7

  # FND-16: fuzzing da API guiado pelo openapi.yaml, contra o compose, com a semente
  # da execução; o relatório fica como artefato e o compose cai em qualquer resultado.
  api-fuzz:
    name: Fuzzing da API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Cria o diretório do relatório
        # A imagem roda como uid 1000; montado sem existir, o diretório nasceria
        # com dono root e modo 755, e o Schemathesis sairia sem gravar (A25).
        run: install -d -m 0777 schemathesis-report
      - name: Fuzzing com o Schemathesis
        env:
          FUZZ_SEED: ${{ github.run_id }}
        run: |
          echo "Semente: $FUZZ_SEED"
          docker compose --profile fuzz run --rm schemathesis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: schemathesis-report
          path: schemathesis-report
          retention-days: 7
      - name: Derruba o compose
        if: always()
        run: docker compose --profile fuzz down -v

  # Uma action fixada por SHA pode ganhar um alerta sem commit; o zizmor com o
  # token de leitura consulta os alertas, como no job workflows do ci.yml.
  workflows:
    name: Workflows na main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          token: ${{ github.token }}

  # O aviso de falha de um agendamento vai para quem mexeu no cron por último, que
  # é a conta de máquina; a issue chega ao dono. Roda em qualquer resultado: um job
  # que falha ou termina cancelado (o tempo esgotado) abre ou comenta a issue, e uma
  # execução verde fecha a que estiver aberta. Só a issue aberta pela conta do
  # Actions conta. Sem checkout e sem instalar nada: a escrita fica num job que não
  # roda código do repositório.
  report:
    name: Avisa o resultado
    needs: [main-full, flaky-hunt, workflows, api-fuzz]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abre, comenta ou fecha a issue da execução agendada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          title="Execução agendada falhou"
          number=$(gh issue list --state open --author app/github-actions --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            body="A execução agendada falhou: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "A execução agendada passou: $RUN_URL"
          fi
