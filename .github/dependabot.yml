# AI-45: os PRs de atualização passam pelo mesmo CI e pela aprovação do dono.
# A espera de 7 dias deixa passar a janela em que uma versão maliciosa costuma ser
# retirada do registro; as atualizações de segurança não esperam.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Mantém a versão exata do package.json (save-exact).
    versioning-strategy: increase
    # Os tipos do Node seguem o piso do engines (24.12): os de uma versão maior
    # deixariam o tsc aceitar API que não existe no piso.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  # As imagens do compose.yaml; com tag e digest juntos, o Dependabot sobe os dois.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Uma versão maior do PostgreSQL pede migrar o diretório de dados do volume.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build(deps)
    groups:
      compose:
        patterns: ['*']
